# Builds Café Chaos and publishes it to GitHub Pages on every push to main.
#   https://<owner>.github.io/cafe-chaos/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older, still-running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafe-chaos/game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cafe-chaos/game/package-lock.json

      # --ignore-scripts skips onnxruntime-node's CUDA download (a dev-only
      # dependency of the IWSDK tooling); the Vite build does not need it.
      - name: Build Café Chaos
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          NODE_ENV=production npm run build
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cafe-chaos/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
