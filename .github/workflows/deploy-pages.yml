# Builds both apps and publishes them to GitHub Pages on every push to main.
#   Meta Notes  -> https://<owner>.github.io/meta-hack/
#   Café Chaos  -> https://<owner>.github.io/meta-hack/cafe-chaos/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older, still-running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            cafe-chaos/game/package-lock.json

      # --ignore-scripts skips onnxruntime-node's CUDA download (a dev-only
      # dependency of the IWSDK tooling); the Vite build does not need it.
      - name: Build Meta Notes
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          NODE_ENV=production npm run build

      - name: Build Café Chaos
        working-directory: cafe-chaos/game
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          NODE_ENV=production npm run build

      - name: Assemble site
        run: |
          mkdir -p site/cafe-chaos
          cp -r app/dist/. site/
          cp -r cafe-chaos/game/dist/. site/cafe-chaos/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
