<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Meta Notes app icon (source). A warm white page with one clay pen
       stroke, on the warm dark body colour. No text, no headset, no brand
       marks. scripts/make-icons.mjs renders the PNGs from this file: the
       "tile" is replaced by a full square for the maskable icon, and the
       "art" group is scaled into its 80% safe zone. -->
  <defs>
    <!-- One soft shadow under the page: a radial fade, not a blur filter
         (blur filters rasterise poorly). -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect id="tile" width="512" height="512" rx="112" fill="#2a2420"/>
  <g id="art">
    <ellipse cx="270" cy="300" rx="168" ry="196" fill="url(#shadow)"/>
    <g transform="rotate(-7 256 256)">
      <!-- The page, its top-right corner folded over. -->
      <path d="M 120 92 H 336 L 392 148 V 420 H 120 Z" fill="#fbf7f0"/>
      <path d="M 336 92 V 148 H 392 Z" fill="#e4dacb"/>
      <!-- Two faint ruled lines: detail at large sizes, gone at small ones. -->
      <path d="M 154 196 H 356 M 154 372 H 356" stroke="#e8e0d3" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- The one pen stroke: short, confident, in clay. -->
    <path d="M 168 312 C 204 244, 248 244, 266 292 S 326 344, 358 262"
          fill="none" stroke="#d4704f" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
