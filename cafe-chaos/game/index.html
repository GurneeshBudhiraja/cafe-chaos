<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- The app icon (public/icons, the same icon as the store: built by scripts/build-store-art.py) and the manifest, for shortcuts and Add to Home Screen. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1f1a17" />
    <meta name="apple-mobile-web-app-title" content="Café Chaos" />
    <title>Café Chaos</title>
    <style>
      @font-face { font-family: CafeJost; src: url(./fonts/jost-600.woff2); font-weight: 600; }
      @font-face { font-family: CafeJost; src: url(./fonts/jost-800.woff2); font-weight: 800; }
      :root { --paper: #d9cfbe; --paper-hi: #e4d9c6; --timber: #66462f; --ink: #16171d; --soft: #5a4030;
        --moss: #3d6136; --moss-deep: #2f522d; --cream: #f2ebdd; --off: #b6a993; --night: #1f1a17; }
      /* The page before the headset view: the same card as in the headset (src/landing.ts draws its rough lines). */
      #landing { position: fixed; inset: 0; z-index: 10; overflow: auto; display: flex; align-items: center; justify-content: center;
        padding: 24px 16px; box-sizing: border-box; font-family: CafeJost, 'Trebuchet MS', sans-serif; color: var(--ink); }
      #landing::before { content: ''; position: fixed; inset: -20px; background: var(--night) url(./ui/cover.jpg) center / cover no-repeat;
        filter: blur(8px) brightness(0.45); }
      .card { position: relative; width: 100%; max-width: 480px; background: var(--timber); padding: 14px; box-sizing: border-box; }
      .card > .inner { position: relative; background: var(--paper); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
      .art { position: relative; aspect-ratio: 720 / 330; background: #2a2420 url(./ui/cover.jpg) center / cover; overflow: hidden; }
      .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(22,23,29,0) 45%, rgba(22,23,29,.85)); }
      .art h1 { position: absolute; z-index: 1; left: 0; right: 0; bottom: 6%; margin: 0; text-align: center; font-weight: 800;
        font-size: clamp(34px, 9vw, 52px); color: var(--cream); letter-spacing: 1px; }
      .btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 64px;
        border: 0; background: var(--paper); color: var(--ink); font: 800 24px CafeJost, 'Trebuchet MS', sans-serif; letter-spacing: 1px;
        cursor: pointer; padding: 0 16px; }
      .btn.primary { min-height: 96px; background: var(--moss); color: var(--cream); font-size: 34px; }
      .btn:hover::before { content: ''; position: absolute; inset: 3px; background: radial-gradient(closest-side, rgba(255,214,140,.32), rgba(255,214,140,0)); }
      .btn.secondary:hover { background: var(--paper-hi); }
      .btn:active { transform: translateY(3px); }
      .btn:focus-visible { outline: 3px solid var(--moss); outline-offset: 4px; }
      .btn[disabled] { background: var(--paper); color: var(--off); cursor: default; }
      .btn[disabled]::before { display: none; }
      .note { margin: 0; text-align: center; font-weight: 600; font-size: 18px; line-height: 1.4; color: var(--soft); }
      .note.warn { color: var(--ink); }
      .note:empty { display: none; }
      /* The rough lines, drawn over each thing that has one, and redrawn ten times a second. */
      svg.rough { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }

      /* How to play: a second card in front, the first one dimmed behind it. */
      #how { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 24px 16px;
        box-sizing: border-box; background: rgba(22, 23, 29, 0.6); overflow: auto; }
      #how.open { display: flex; }
      #how .card { max-width: 760px; margin: auto; }
      /* How to play: one step at a time (src/landing.ts builds it from src/game/how-to-play.ts). */
      .how-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      #how h2 { margin: 0; font-weight: 800; font-size: 34px; }
      .btn.icon { width: 56px; min-height: 56px; padding: 0; flex: none; font-size: 26px; }
      .frame { position: relative; aspect-ratio: 16 / 9; background: #2a2420 center / cover no-repeat; overflow: hidden; }
      .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      .step-text { min-height: 128px; }
      .step-text h3 { margin: 4px 0 8px; font-weight: 800; font-size: 26px; line-height: 1.2; display: flex; align-items: center; gap: 12px; }
      .step-text h3 .num { flex: none; width: 38px; height: 38px; display: grid; place-items: center; background: var(--moss); color: var(--cream); font-size: 22px; }
      .step-text p { margin: 0; font-weight: 600; font-size: 20px; line-height: 1.45; color: var(--soft); }
      .how-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
      .how-nav .btn { min-height: 64px; font-size: 22px; }
      .how-nav .btn.primary { min-height: 64px; font-size: 22px; }
      .dots { display: flex; gap: 10px; }
      .dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--off); box-sizing: border-box; }
      .dots i.on { background: var(--moss); border-color: var(--moss-deep); }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (max-width: 640px) {
        .how-nav { grid-template-columns: 1fr 1fr; }
        .dots { grid-column: 1 / -1; grid-row: 1; justify-content: center; }
        .step-text p { font-size: 18px; }
      }
      body.in-xr #landing, body.in-xr #how { display: none; }
    </style>
  </head>
  <!-- Transparent canvas: in the headset the real room (passthrough) shows behind the café. -->
  <body style="margin: 0; background: #1f1a17; font-family: CafeJost, 'Trebuchet MS', sans-serif; color: #16171d">
    <div id="landing">
      <div class="card sketch" data-stroke="timber">
        <div class="inner">
          <div class="art sketch"><h1>CAFÉ CHAOS</h1></div>
          <button id="start" class="btn primary sketch" data-stroke="moss-deep" type="button">PLAY IN VR</button>
          <button id="help" class="btn secondary sketch" type="button">? HOW TO PLAY</button>
          <p class="note" id="note"></p>
        </div>
      </div>
    </div>

    <div id="how" role="dialog" aria-modal="true" aria-labelledby="how-title">
      <div class="card sketch" data-stroke="timber">
        <div class="inner">
          <div class="how-head">
            <h2 id="how-title">How to play</h2>
            <button id="how-close" class="btn secondary sketch icon" type="button" aria-label="Close How to play">✕</button>
          </div>
          <div class="frame sketch" id="how-frame"><video id="how-video" muted loop playsinline preload="auto" aria-hidden="true"></video></div>
          <div class="step-text" aria-live="polite">
            <span class="sr" id="how-count"></span>
            <h3><span class="num" id="how-num">1</span><span id="how-step-title"></span></h3>
            <p id="how-step-text"></p>
          </div>
          <div class="how-nav">
            <button id="how-prev" class="btn secondary sketch" type="button">PREVIOUS</button>
            <div class="dots" id="how-dots" aria-hidden="true"></div>
            <button id="how-next" class="btn primary sketch" data-stroke="moss-deep" type="button">NEXT</button>
          </div>
        </div>
      </div>
    </div>

    <div id="scene-container"></div>
    <script type="module" src="/src/landing.ts"></script>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
