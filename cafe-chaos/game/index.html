<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="data:," />
    <title>Café Chaos</title>
    <style>
      @font-face { font-family: CafeJost; src: url(./fonts/jost-600.woff2); font-weight: 600; }
      @font-face { font-family: CafeJost; src: url(./fonts/jost-800.woff2); font-weight: 800; }
      /* The page before the headset view: the cover, the name, and Start. */
      #landing { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background: #1f1a17 url(./ui/cover.jpg) center / cover no-repeat; font-family: CafeJost, 'Trebuchet MS', sans-serif; }
      #landing::before { content: ''; position: absolute; inset: 0; background: rgba(22, 23, 29, 0.55); }
      #landing .card { position: relative; background: #d9cfbe; border: 12px solid #66462f; border-radius: 6px; padding: 40px 48px;
        text-align: center; max-width: 520px; width: calc(100% - 64px); box-sizing: border-box; color: #16171d; }
      #landing h1 { font-weight: 800; font-size: clamp(40px, 8vw, 64px); margin: 0 0 8px; letter-spacing: 1px; }
      #landing p { font-weight: 600; font-size: 22px; color: #5a4030; margin: 0 0 32px; }
      #landing button { font: 800 32px CafeJost, 'Trebuchet MS', sans-serif; color: #f2ebdd; background: #3d6136; border: 4px solid #2f522d;
        border-radius: 6px; padding: 18px 0; width: 100%; cursor: pointer; letter-spacing: 1px; }
      #landing button:hover { background: #47703f; }
      #landing small { display: block; margin-top: 20px; font-weight: 600; font-size: 18px; color: #5a4030; }
      body.in-xr #landing { display: none; }
    </style>
  </head>
  <!-- Transparent canvas: in the headset the real room (passthrough) shows behind the café. -->
  <body style="margin: 0; background: #1f1a17">
    <div id="landing">
      <div class="card">
        <h1>CAFÉ CHAOS</h1>
        <p>A tiny café on your table. Hands only.</p>
        <button id="start" type="button">START</button>
        <small>Sit at a table. Put your controllers down.</small>
      </div>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
