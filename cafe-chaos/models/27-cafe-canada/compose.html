<!doctype html>
<html><head><meta charset="utf-8"><title>Canada compose</title>
<style>html,body{margin:0;height:100%;background:#cfdbe8;overflow:hidden}canvas{display:block}#hud{position:fixed;left:8px;top:8px;font:12px system-ui;color:#123;background:#fff9;padding:4px 8px;border-radius:6px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="hud">loading</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfdbe8);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 20);
camera.position.set(...(q.get('eye') || '0,0.55,0.95').split(',').map(Number));
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(...(q.get('at') || '0,0.06,-0.02').split(',').map(Number)); controls.update();
const sun = new THREE.DirectionalLight(0xfff2e0, 2.4); sun.position.set(0.6, 1.2, 0.8); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd4ee, 0xe8e2d8, 1.1)); scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const loader = new GLTFLoader();
const cache = {};
const load = (n) => cache[n] ??= new Promise((ok, no) => loader.load(`${n}.glb`, ok, undefined, no));
const mixers = [];
function matte(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material;
    if (m.isMeshStandardMaterial) o.material = new THREE.MeshLambertMaterial({ name: m.name, color: m.color, map: m.map, emissive: m.emissive, emissiveMap: m.emissiveMap,
      emissiveIntensity: m.emissiveIntensity, normalMap: m.normalMap, normalScale: m.normalScale, aoMap: m.aoMap, aoMapIntensity: m.aoMapIntensity,
      transparent: m.transparent, opacity: m.opacity, side: m.side, alphaTest: m.alphaTest, depthWrite: m.depthWrite });
  });
}
async function place(name, x, y, z, yawDeg = 0, clip = null, opts = {}) {
  const g = await load(name);
  const root = g.scene.clone(true);
  matte(root);
  root.position.set(x, y, z); root.rotation.y = (yawDeg * Math.PI) / 180;
  scene.add(root);
  if (opts.seated !== undefined) {
    const st = root.getObjectByName('Standing'), se = root.getObjectByName('Seated');
    if (st) st.visible = !opts.seated; if (se) se.visible = !!opts.seated;
  }
  if (clip) {
    const c = g.animations.find((a) => a.name === clip);
    if (c) { const mx = new THREE.AnimationMixer(root); const act = mx.clipAction(c); act.play(); act.time = opts.t ?? 0; mixers.push(mx); }
  }
  for (const [item, at] of opts.wear ?? []) {
    const acc = (await load('accessories-canada')).scene.getObjectByName(item);
    for (const prefix of ['St-', 'Se-']) { const a = acc.clone(); a.position.set(0, 0, 0); a.rotation.set(0, 0, 0); matte(a); root.getObjectByName(prefix + at)?.add(a); }
  }
  return root;
}
// The layout (game/src/cafe/canada-layout.ts), three.js yaw.
const UY = 0.1548, F = 0.024;
const layout = [
  ['cafe-canada', 0, 0, 0, 0], ['table-ca-2', -0.31, F, -0.09, 0], ['table-ca-2', -0.31, F, 0.09, 0], ['table-ca-4', -0.17, F, 0.0, 90],
  ['table-ca-2', -0.03, F, -0.09, 0], ['table-ca-2', -0.03, F, 0.09, 0],
  ['patio-table', 0.16, F, 0.08, 0], ['patio-table', 0.31, F, 0.06, 0], ['dock-bench', 0.26, 0.030, 0.25, 0],
  ...[205, 270, 335].map((a) => ['fire-chair', -0.27 + 0.085 * Math.cos(a * Math.PI / 180), F, 0.245 - 0.085 * Math.sin(a * Math.PI / 180), a - 90]),
  ['patio-table', -0.27, UY, -0.2125, 0], ['patio-table', -0.11, UY, -0.2125, 0],
];
const pieces = [];
for (const [n, x, y, z, yaw] of layout) pieces.push(await place(n, x, y, z, yaw, n === 'cafe-canada' ? 'Ambient' : null));
scene.updateMatrixWorld(true);
// Seat guests on some seats (each seat's world position and facing), standing ones on the stairs and at the gate.
const seats = [];
pieces.forEach((p, i) => p.traverse((o) => { if (/^Seat-\d+$/.test(o.name)) seats.push({ piece: i, o }); }));
const species = ['guest-snowbit', 'guest-beavertail', 'guest-nanaimo'];
const wear = [[['Toque-snowbit', 'HeadTop'], ['Scarf-snowbit', 'Neck']], [['Earmuffs-beavertail', 'HeadTop']], [['Parka-nanaimo', 'Chest']]];
const sitOn = (q.get('sit') || '1,3,5,9,10,12,14,17,19,20').split(',').map(Number);
let k = 0;
for (const si of sitOn) {
  const s = seats[si]; if (!s) continue;
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion();
  s.o.getWorldPosition(pos); s.o.getWorldQuaternion(quat);
  const yaw = new THREE.Euler().setFromQuaternion(quat, 'YXZ').y * 180 / Math.PI;
  const i = k++ % 3;
  await place(species[i], pos.x, pos.y, pos.z, yaw, 'SitIdle', { seated: true, wear: wear[i], t: k * 0.3 });
}
// The stairs: a guest going up at step 4, a barista carrying a tray up at step 11 (steps 9 mm, 8.7 mm up, from z -0.012).
const step = (n) => [0.081, F + n * ((UY - F) / 15), -0.012 - (n - 0.5) * 0.009];
await place('guest-snowbit', ...step(4), 180, 'StairsUp', { seated: false, wear: wear[0] });
await place('barista-maple', ...step(11), 180, 'CarryUp');
// Staff: two baristas at their stations, the janitor at the counter's way out, both musicians playing.
await place('barista-aspen', -0.115, 0.036, -0.204, 0, 'Work', { t: 0.5 });
await place('barista-rowan', -0.235, 0.036, -0.204, 0, 'Work', { t: 1.1 });
await place('barista-birch', -0.39, F, -0.13, 90, 'Idle');   // at the counter's way out (the door-side tables fill the till's corner)
await place('barista-fiddler', 0.30, 0.035, -0.21, 180, 'Play');
await place('barista-pianist', -0.365, UY, -0.2125, -90, 'PlayPiano');
// Two guests waiting at the gate (outside the right edge, as the queue does).
await place('guest-beavertail', 0.47, F, 0.055, -90, 'Idle', { seated: false, wear: wear[1] });
await place('guest-nanaimo', 0.50, F, 0.10, -90, 'Idle', { seated: false });
let tris = 0, draws = 0; scene.traverse((o) => { if (o.isMesh && o.visible) { draws++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
document.getElementById('hud').textContent = `meshes ${draws}  tris ${Math.round(tris)}  seats ${seats.length}`;
window.seatsInfo = seats.map((s, i) => { const p = new THREE.Vector3(); s.o.getWorldPosition(p); return [i, s.piece, +p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3)]; });
window.ready = true;
const clock = new THREE.Clock();
function frame() { requestAnimationFrame(frame); const d = clock.getDelta(); for (const m of mixers) m.update(q.has('still') ? 0 : d); controls.update(); renderer.render(scene, camera); }
frame();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script></body></html>
